<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d6efd">
<title>SIAKAD & LMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="login" class="login">
  <div class="card login-card shadow p-4">
    <div class="text-center mb-3"><h2 class="fw-bold">SIAKAD & LMS</h2><p class="text-secondary mb-0">Sistem Informasi Akademik & Learning Management System</p></div>
    <form id="form">
      <label class="form-label">Username</label><input id="username" class="form-control mb-3" autocomplete="username" required>
      <label class="form-label">Password</label><input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
      <button id="loginBtn" class="btn btn-primary w-100">Masuk</button>
    </form>
    <div class="alert alert-light border small mt-3 mb-0">Demo: <b>admin/admin123</b> · <b>guru/guru123</b> · <b>siswa/siswa123</b></div>
  </div>
</div>

<div id="app" class="d-none">
<nav class="navbar navbar-dark bg-primary sticky-top shadow-sm"><div class="container-fluid px-3">
<div class="d-flex align-items-center gap-2"><button id="toggle" class="btn btn-outline-light">☰</button><span class="fw-bold fs-5">SIAKAD <small class="fw-normal opacity-75">• Sekolah</small></span></div>
<div class="d-flex align-items-center gap-3"><span id="topDate" class="d-none d-md-inline small opacity-75"></span><span id="topUser" class="d-none d-md-inline"></span><button id="logout" class="btn btn-light btn-sm rounded-pill px-3">Keluar</button></div>
</div></nav>
<div class="layout">
<aside id="side"><div class="p-3 mb-3 rounded-4 bg-primary text-white"><div class="small opacity-75">LOGIN SEBAGAI</div><div id="who" class="fw-bold mt-1"></div><div id="roleBadge" class="badge bg-light text-primary mt-2"></div></div><div class="small text-uppercase text-secondary fw-bold px-2 mb-2">Menu Utama</div>
<button data-page="dashboard">🏠 Dashboard</button><button data-page="Students">👨‍🎓 Data Siswa</button><button data-page="Teachers">👨‍🏫 Data Guru</button><button data-page="Classes">🏫 Kelas</button><button data-page="Subjects">📚 Mata Pelajaran</button><button data-page="Grades">📝 Nilai</button><button data-page="Attendance">📅 Presensi</button><hr>
<button data-page="Courses">🎓 Kelas LMS</button><button data-page="Materials">📖 Materi</button><button data-page="Assignments">📋 Tugas</button><button data-page="Submissions">📤 Pengumpulan</button><button data-page="Announcements">📢 Pengumuman</button>
</aside><main id="content"></main></div></div>

<div class="modal fade" id="dataModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
<div class="modal-header"><h5 id="modalTitle" class="modal-title">Data</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<form id="dataForm"><div class="modal-body" id="fields"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary">Simpan</button></div></form>
</div></div></div>
<div id="toast" class="toast-msg"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script>
</body></html>
