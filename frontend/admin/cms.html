<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS Website • SIAKAD</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f8fc}.card{border:0;border-radius:18px}.table td,.table th{vertical-align:middle}.editor{position:sticky;top:20px}.muted{font-size:.85rem}</style></head>
<body><nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><b>CMS Website Sekolah</b><div class="d-flex gap-2"><a class="btn btn-light btn-sm" href="../../">Lihat Website</a><a class="btn btn-outline-light btn-sm" href="../">Dashboard</a></div></div></nav>
<main class="container py-4"><div id="app"></div></main>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script>
const entities={SchoolProfile:"Profil Sekolah",LandingBanners:"Logo & Banner",News:"Berita",Agenda:"Agenda",Gallery:"Galeri",PPDB:"Informasi PPDB"};
const schemas={SchoolProfile:["Key","Value"],LandingBanners:["ID","Title","Subtitle","ImageURL","ButtonText","ButtonURL","Status"],News:["ID","Title","Excerpt","Content","ImageURL","Date","Status"],Agenda:["ID","Title","Description","Date","Time","Location","Status"],Gallery:["ID","Title","ImageURL","Caption","Date","Status"],PPDB:["ID","Title","Description","StartDate","EndDate","URL","Status"]};
let user=null,activeEntity="SchoolProfile",activeData=[];const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const payload=o=>Object.assign({},o,{token:user?.token});
function notify(message,ok=true){let n=$("#notify");if(!n){n=document.createElement("div");n.id="notify";n.className="position-fixed bottom-0 end-0 m-3 alert shadow";document.body.appendChild(n)}n.className="position-fixed bottom-0 end-0 m-3 alert shadow "+(ok?"alert-success":"alert-danger");n.textContent=message;setTimeout(()=>n.remove(),3000)}
try{user=JSON.parse(localStorage.getItem("siakad_user")||"null")}catch(e){user=null}
if(!user||String(user.role||"").trim().toLowerCase()!=="admin"){$("#app").innerHTML='<div class="alert alert-danger"><b>Akses ditolak.</b><br>Halaman CMS hanya dapat dibuka oleh Admin.<br><a href="../" class="btn btn-primary mt-3">Kembali ke Dashboard</a></div>'}else{renderShell();openEditor("SchoolProfile")}
function renderShell(){$("#app").innerHTML='<div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1">Kelola Website</h2><p class="text-secondary mb-0">Kelola konten website sekolah.</p></div><span class="badge text-bg-primary">ADMIN CMS</span></div><div class="row g-3 mb-4">'+Object.keys(entities).map(e=>'<div class="col-6 col-lg-4 col-xl-2"><button class="btn bg-white shadow-sm w-100 p-3 h-100 text-start" onclick="openEditor(\''+e+'\')"><b>'+entities[e]+'</b><span class="d-block small text-secondary mt-1">Kelola</span></button></div>').join("")+'</div><div id="editor"></div>'}
async function openEditor(entity){activeEntity=entity;const r=await API.call("landingList",payload({entity:entity}));if(!r.success){notify(r.message||"Gagal memuat data",false);return}activeData=r.data||[];const fields=schemas[entity]||[];$("#editor").innerHTML='<div class="card shadow-sm p-4"><div class="d-flex justify-content-between align-items-center"><h4>'+entities[entity]+'</h4><button class="btn btn-primary" onclick="editItem(-1)">+ Tambah</button></div><div class="table-responsive mt-3"><table class="table table-hover"><thead><tr>'+fields.map(f=>'<th>'+esc(f)+'</th>').join("")+'<th>Aksi</th></tr></thead><tbody>'+(activeData.length?activeData.map((x,i)=>'<tr>'+fields.map(f=>'<td>'+esc(String(x[f]??"").slice(0,120))+'</td>').join("")+'<td><button class="btn btn-sm btn-outline-primary" onclick="editItem('+i+')">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('+i+')">Hapus</button></td></tr>').join(""):'<tr><td colspan="'+(fields.length+1)+'" class="text-center text-secondary py-4">Belum ada data.</td></tr>')+'</tbody></table></div></div><div id="formbox"></div>'}
function editItem(index){const fields=schemas[activeEntity],row=index<0?{}:activeData[index];$("#formbox").innerHTML='<div class="card shadow-sm p-4 mt-3"><h5>'+(index<0?"Tambah ":"Edit ")+entities[activeEntity]+'</h5><form id="cmsform">'+fields.map(k=>{const ro=activeEntity==="SchoolProfile"&&k==="Key"&&index>=0;const area=/Content|Description|Value|Subtitle|Excerpt|Caption/i.test(k);return '<div class="mb-3"><label class="form-label">'+esc(k)+'</label>'+(area?'<textarea class="form-control" name="'+esc(k)+'" rows="3" '+(ro?"readonly":"")+'>'+esc(row[k]||"")+'</textarea>':'<input class="form-control" name="'+esc(k)+'" value="'+esc(row[k]||"")+'" '+(ro?"readonly":"")+'>')+'</div>'}).join("")+'<button class="btn btn-primary">Simpan</button> <button type="button" class="btn btn-secondary" onclick="openEditor(activeEntity)">Batal</button></form></div>';$("#cmsform").onsubmit=async ev=>{ev.preventDefault();const data={};new FormData(ev.target).forEach((v,k)=>data[k]=v);const id=activeEntity==="SchoolProfile"?data.Key:data.ID;const res=await API.call(index<0?"landingCreate":"landingUpdate",payload({entity:activeEntity,data:data,id:id}));notify(res.message||"Selesai",!!res.success);if(res.success)openEditor(activeEntity)}}
async function deleteItem(index){const row=activeData[index];if(!row||!confirm("Hapus data ini?"))return;const id=activeEntity==="SchoolProfile"?row.Key:row.ID;const res=await API.call("landingDelete",payload({entity:activeEntity,id:id,data:row}));notify(res.message||"Selesai",!!res.success);if(res.success)openEditor(activeEntity)}
</script></body></html>
