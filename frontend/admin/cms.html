<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS Website • SIAKAD</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f8fc}.card{border:0;border-radius:18px}.table td,.table th{vertical-align:middle}.editor{position:sticky;top:20px}.muted{font-size:.85rem}</style></head>
<body><nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><b>CMS Website Sekolah</b><div class="d-flex gap-2"><a class="btn btn-light btn-sm" href="../../">Lihat Website</a><a class="btn btn-outline-light btn-sm" href="../">Dashboard</a></div></div></nav>
<main class="container py-4"><div id="app"></div></main>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script>
const entities={SchoolProfile:"Profil Sekolah",LandingBanners:"Logo & Banner",News:"Berita",Agenda:"Agenda",Gallery:"Galeri",PPDB:"Informasi PPDB"};
const schemas={
 SchoolProfile:["Key","Value"],LandingBanners:["ID","Title","Subtitle","ImageURL","ButtonText","ButtonURL","Status"],
 News:["ID","Title","Excerpt","Content","ImageURL","Date","Status"],Agenda:["ID","Title","Description","Date","Time","Location","Status"],
 Gallery:["ID","Title","ImageURL","Caption","Date","Status"],PPDB:["ID","Title","Description","StartDate","EndDate","URL","Status"]
};
let u,activeEntity,activeData=[];
try{u=JSON.parse(localStorage.getItem("siakad_user")||"null")}catch(e){}
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const payload=x=>({...x,token:u?.token});
function fail(m){$("#app").innerHTML='<div class="alert alert-danger">'+esc(m)+'</div>'}
if(!u||u.role!=="Admin")fail("Halaman ini khusus Admin. Silakan login sebagai Admin.");
else init();
async function init(){renderShell();await openEditor("SchoolProfile")}
function renderShell(){
 $("#app").innerHTML='<div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1">Kelola Website</h2><p class="text-secondary mb-0">Semua konten landing page dikelola dari sini.</p></div><span class="badge text-bg-primary">ADMIN CMS</span></div><div class="row g-3 mb-4">'+Object.entries(entities).map(([e,n])=>'<div class="col-6 col-lg-4 col-xl-2"><button class="btn btn-white bg-white shadow-sm w-100 p-3 h-100 text-start" onclick="openEditor(\''+e+'\')"><b>'+n+'</b><span class="d-block muted text-secondary mt-1" id="count-'+e+'">Memuat...</span></button></div>').join("")+'</div><div id="editor"></div>';
}
async function refreshCounts(){for(const e of Object.keys(entities)){const r=await API.call("landingList",payload({entity:e}));const el=$("#count-"+e);if(el)el.textContent=(r.success?(r.data||[]).length:"Gagal")+" data"}}
async function openEditor(e){
 activeEntity=e;const r=await API.call("landingList",payload({entity:e}));
 if(!r.success){notify(r.message||"Gagal memuat data",false);return}
 activeData=r.data||[];const fields=schemas[e];
 $("#editor").innerHTML='<div class="card shadow-sm p-4"><div class="d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h4 class="mb-1">'+entities[e]+'</h4><small class="text-secondary">'+activeData.length+' data</small></div><button class="btn btn-primary" onclick="editItem(-1)">+ Tambah</button></div><div class="table-responsive mt-4"><table class="table table-hover"><thead><tr>'+fields.map(f=>'<th>'+esc(f)+'</th>').join("")+'<th>Aksi</th></tr></thead><tbody>'+(activeData.length?activeData.map((x,i)=>'<tr>'+fields.map(f=>'<td>'+esc(String(x[f]??"").slice(0,120))+'</td>').join("")+'<td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="editItem('+i+')">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('+i+')">Hapus</button></td></tr>').join(""):'<tr><td colspan="'+(fields.length+1)+'" class="text-center text-secondary py-4">Belum ada data.</td></tr>')+'</tbody></table></div></div><div id="formbox"></div>';
 await refreshCounts();
}
function editItem(i){const fields=schemas[activeEntity],o=i<0?{}:activeData[i];$("#formbox").innerHTML='<div class="card shadow-sm p-4 mt-3 editor"><h5>'+(i<0?"Tambah":"Edit")+' '+entities[activeEntity]+'</h5><form id="cmsform" class="mt-3">'+fields.map(k=>{const ro=activeEntity==="SchoolProfile"&&k==="Key"&&i>=0;const area=/Content|Description|Value|Subtitle|Excerpt|Caption|about|vision|mission/i.test(k);const type=/Date|StartDate|EndDate/i.test(k)?"date":"text";return '<div class="mb-3"><label class="form-label">'+esc(k)+'</label>'+(area?'<textarea class="form-control" name="'+esc(k)+'" rows="3" '+(ro?"readonly":"")+'>'+esc(o[k]||"")+'</textarea>':'<input class="form-control" type="'+type+'" name="'+esc(k)+'" value="'+esc(o[k]||"")+'" '+(ro?"readonly":"")+'></div>'}).join("")+'<div class="d-flex gap-2"><button class="btn btn-primary">Simpan</button><button type="button" class="btn btn-secondary" onclick="openEditor(activeEntity)">Batal</button></div></form></div>';
 $("#cmsform").onsubmit=async ev=>{ev.preventDefault();const d={};new FormData(ev.target).forEach((v,k)=>d[k]=v);const isUpdate=i>=0;const id=activeEntity==="SchoolProfile"?d.Key:d.ID;const action=isUpdate?"Update":"Create";const res=await API.call("landing"+action,payload({entity:activeEntity,data:d,id}));notify(res.message||"Selesai",res.success);if(res.success)openEditor(activeEntity)};
}
async function deleteItem(i){const o=activeData[i];if(!confirm("Hapus data ini?"))return;const id=activeEntity==="SchoolProfile"?o.Key:o.ID;const r=await API.call("landingDelete",payload({entity:activeEntity,id,data:o}));notify(r.message||"Selesai",r.success);if(r.success)openEditor(activeEntity)}
function notify(m,ok){let n=document.getElementById("notify");if(!n){n=document.createElement("div");n.id="notify";n.className="position-fixed bottom-0 end-0 m-3 alert shadow";document.body.appendChild(n)}n.className="position-fixed bottom-0 end-0 m-3 alert shadow "+(ok?"alert-success":"alert-danger");n.textContent=m;setTimeout(()=>n.remove(),3000)}
</script></body></html>
