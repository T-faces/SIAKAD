<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS Website • SIAKAD</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><b>CMS Website Sekolah</b><a class="btn btn-light btn-sm" href="../">Kembali</a></div></nav><main class="container py-4"><div id="app"></div></main><script src="../js/config.js"></script><script src="../js/api.js"></script><script>
const entities={SchoolProfile:"Profil Sekolah",LandingBanners:"Logo & Banner",News:"Berita",Agenda:"Agenda",Gallery:"Galeri",PPDB:"Informasi PPDB"};let u;try{u=JSON.parse(localStorage.getItem("siakad_user")||"null")}catch(e){};const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));if(!u||u.role!=="Admin")$("#app").innerHTML='<div class="alert alert-danger">Halaman ini khusus Admin. Silakan login sebagai Admin.</div>';else render();
function payload(x){return{...x,token:u.token}}async function render(){const r=await Promise.all(Object.keys(entities).map(e=>API.call("landingList",payload({entity:e}))));$("#app").innerHTML='<h2 class="fw-bold mb-4">Kelola Website Sekolah</h2><div class="row g-3">'+Object.keys(entities).map((e,i)=>'<div class="col-md-6 col-xl-4"><div class="card shadow-sm border-0 p-4 h-100"><h5>'+entities[e]+'</h5><p class="text-secondary">'+(r[i].data?.length||0)+' data</p><button class="btn btn-primary" onclick="openEditor(\''+e+'\')">Kelola</button></div></div>').join("")+'</div><div id="editor" class="mt-4"></div>'}
async function openEditor(e){const r=await API.call("landingList",payload({entity:e}));const data=r.data||[];const sample=data[0]||{};const fields=Object.keys(sample).filter(k=>k!=="__row");$("#editor").innerHTML='<div class="card shadow-sm p-4"><div class="d-flex justify-content-between"><h4>'+entities[e]+'</h4><button class="btn btn-success" onclick="newItem(\''+e+'\')">+ Tambah</button></div><div class="table-responsive mt-3"><table class="table"><thead><tr>'+fields.map(f=>'<th>'+f+'</th>').join("")+'<th>Aksi</th></tr></thead><tbody>'+data.map((x,i)=>'<tr>'+fields.map(f=>'<td>'+esc(String(x[f]).slice(0,80))+'</td>').join("")+'<td><button class="btn btn-sm btn-outline-primary" onclick="editItem(\''+e+'\','+i+')">Edit</button></td></tr>').join("")+'</tbody></table></div></div>';window._cms={e,data,fields}}
function newItem(e){editItem(e,-1)}function editItem(e,i){const o=i<0?{}:window._cms.data[i],f=window._cms.fields;$("#editor").insertAdjacentHTML("beforeend",'<div class="card shadow p-4 mt-3" id="formbox"><h5>'+ (i<0?"Novo":"Editar")+' '+entities[e]+'</h5><form id="cmsform">'+f.filter(k=>k!=="ID").map(k=>'<div class="mb-3"><label class="form-label">'+k+'</label><textarea class="form-control" name="'+k+'" rows="'+(/Content|Description|vision|mission|about/i.test(k)?3:1)+'">'+esc(o[k]||"")+'</textarea></div>').join("")+'<input type="hidden" name="ID" value="'+esc(o.ID||"")+'"><button class="btn btn-primary">Simpan</button></form></div>');$("#cmsform").onsubmit=async ev=>{ev.preventDefault();const d={};new FormData(ev.target).forEach((v,k)=>d[k]=v);const a=d.ID?"update":"create",r=await API.call("landing"+a[0].toUpperCase()+a.slice(1),payload({entity:e,data:d,id:d.ID}));alert(r.message);if(r.success)openEditor(e)}}
</script></body></html>
