<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIAKAD • Modul Lengkap</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fb}.card{border:0;border-radius:16px}.nav-pills .nav-link{color:#495057}.nav-pills .nav-link.active{background:#0d6efd;color:white}.table-responsive{max-height:65vh}</style></head><body><nav class="navbar bg-primary navbar-dark"><div class="container-fluid"><b>SIAKAD • Modul Lengkap</b><span id="user"></span></div></nav><div class="container-fluid p-3"><div id="msg"></div><div class="row g-3"><aside class="col-lg-2"><div class="card p-2 shadow-sm"><div class="nav nav-pills flex-column" id="menu"></div></div></aside><main class="col-lg-10"><div id="view"></div></main></div></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script>const modules={Users:"Manajemen Pengguna",Students:"Siswa",Teachers:"Guru",Classes:"Kelas",Subjects:"Mata Pelajaran",Courses:"Kursus LMS",Materials:"Materi",Assignments:"Tugas",Submissions:"Pengumpulan",Grades:"Nilai",Attendance:"Presensi",Announcements:"Pengumuman",Settings:"Pengaturan",ActivityLog:"Log Aktivitas"};let u=null;try{u=JSON.parse(localStorage.getItem("siakad_user")||"null")}catch(e){};const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));const payload=x=>({...x,token:u?.token});if(!u){$("#msg").innerHTML='<div class="alert alert-warning">Silakan login melalui halaman utama SIAKAD terlebih dahulu.</div>'}else{ $("#user").textContent=u.nama+" • "+u.role;buildMenu();load("Students")}function buildMenu(){let keys=Object.keys(modules);if(u.role!=="Admin")keys=keys.filter(x=>u.role==="Guru"?["Students","Teachers","Classes","Subjects","Courses","Materials","Assignments","Submissions","Grades","Attendance","Announcements"].includes(x):["Courses","Materials","Assignments","Submissions","Grades","Attendance","Announcements"].includes(x));$("#menu").innerHTML=keys.map(k=>'<button class="nav-link text-start" data-e="'+k+'">'+modules[k]+"</button>").join("");document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>load(b.dataset.e))}async function load(e){document.querySelectorAll("[data-e]").forEach(b=>b.classList.toggle("active",b.dataset.e===e));const r=await API.call("list",payload({entity:e}));if(!r.success){$("#view").innerHTML='<div class="alert alert-danger">'+esc(r.message)+"</div>";return}const data=r.data||[],cols=data.length?Object.keys(data[0]):[];$("#view").innerHTML='<div class="d-flex justify-content-between align-items-center mb-3"><div><h3>'+modules[e]+'</h3><small class="text-secondary">'+data.length+" data</small></div></div>"+(data.length?'<div class="card shadow-sm p-3"><div class="table-responsive"><table class="table table-hover"><thead><tr>'+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr></thead><tbody>"+data.map(x=>"<tr>"+cols.map(c=>"<td>"+esc(x[c])+"</td>").join("")+"</tr>").join("")+"</tbody></table></div></div>":'<div class="card shadow-sm p-5 text-center text-secondary">Belum ada data pada modul ini.</div>')}</script></body></html>
